<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sexata</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #000, #333);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .login-container {
            background-color: #fff;
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            text-align: center;
            color: #222;
        }

        .login-container h1 {
            margin-bottom: 20px;
            font-size: 2.3em;
            letter-spacing: 2px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 1em;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-container button:hover {
            background-color: #ff6600;
        }

        .login-container a {
            display: block;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 0.9em;
        }

        .login-container a:hover {
            color: #ff6600;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Sexata</h1>

        <input id="user" type="text" placeholder="Usuario">
        <input id="pass" type="password" placeholder="Contraseña">

        <button onclick="login()">Acceder</button>

        <p class="error" id="errorMsg">Usuario o contraseña incorrectos</p>

        <a href="#">¿Olvidaste tu contraseña?</a>
        <a href="#">Crear cuenta nueva</a>
    </div>

<script>
    function login() {
        const user = document.getElementById("user").value.trim();
        const pass = document.getElementById("pass").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        // SISTEMA DE ROLES
        const adminUser = "admin";
        const adminPass = "admin123";

        const normalUser = "usuario";
        const normalPass = "1234";

        // VALIDACIÓN
        if (user === adminUser && pass === adminPass) {
            window.location.href = "1.html"; // Redirección admin
        } 
        else if (user === normalUser && pass === normalPass) {
            window.location.href = "1.html"; // Redirección usuario normal
        } 
        else {
            errorMsg.style.display = "block";
        }
    }
</script>

</body>
</html>
